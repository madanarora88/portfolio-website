<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Offline - Madan Arora</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container { max-width: 640px; width: 100%; text-align: center; }
    .emoji {
      font-size: 120px;
      animation: float 3s ease-in-out infinite;
      display: inline-block;
      margin-bottom: 20px;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }
    h1 {
      font-size: 48px;
      font-weight: 800;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      font-size: 20px;
      color: rgba(248, 250, 252, 0.7);
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .game-container {
      background: rgba(248, 250, 252, 0.05);
      border: 2px solid rgba(248, 250, 252, 0.1);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 32px;
      backdrop-filter: blur(10px);
    }
    .game-container h2 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #f8fafc;
    }
    .game-container > p {
      font-size: 15px;
      margin-bottom: 16px;
      color: rgba(248, 250, 252, 0.55);
    }
    .runner-scores {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-bottom: 12px;
      font-variant-numeric: tabular-nums;
    }
    .runner-scores .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(248, 250, 252, 0.5);
      margin-bottom: 2px;
    }
    .runner-scores .value {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #gameCanvas {
      width: 100%;
      max-width: 560px;
      height: auto;
      background: rgba(248, 250, 252, 0.04);
      border: 1px solid rgba(248, 250, 252, 0.12);
      border-radius: 12px;
      display: block;
      margin: 0 auto;
      touch-action: manipulation;
      cursor: pointer;
    }
    .runner-hint {
      margin-top: 12px;
      font-size: 13px;
      color: rgba(248, 250, 252, 0.45);
    }
    button {
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      border: none;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
      font-family: inherit;
      box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(59, 130, 246, 0.4);
    }
    button:active { transform: scale(0.95); }
    .retry { margin-top: 32px; font-size: 14px; color: rgba(248, 250, 252, 0.5); }
    .retry-btn {
      background: rgba(248, 250, 252, 0.1);
      margin-top: 12px;
      box-shadow: none;
    }
    .retry-btn:hover { background: rgba(248, 250, 252, 0.15); }
    .wifi-animation {
      display: inline-block;
      animation: pulse 2s ease-in-out infinite;
      font-size: 32px;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.1); }
    }
    .online-notice {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2) 0%, rgba(5, 150, 105, 0.2) 100%);
      border: 2px solid rgba(16, 185, 129, 0.4);
      padding: 24px;
      border-radius: 12px;
      margin-top: 20px;
    }
    .online-notice h3 { color: #10b981; font-size: 24px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">📡</div>
    <h1>You're Offline!</h1>
    <p>Looks like you've lost connection. Here's something to do while you wait.</p>

    <div class="game-container">
      <h2>🦖 Jump while you wait</h2>
      <p>Press Space, tap, or click to jump over the obstacles.</p>

      <div class="runner-scores">
        <div>
          <div class="label">Score</div>
          <div class="value" id="score">0</div>
        </div>
        <div>
          <div class="label">Best</div>
          <div class="value" id="best">0</div>
        </div>
      </div>

      <canvas id="gameCanvas" width="560" height="180"></canvas>
      <div class="runner-hint" id="runnerHint">Press Space / tap to start</div>
    </div>

    <div class="retry" id="retrySection">
      <div class="wifi-animation">📶</div>
      <div style="margin-top: 8px;">Checking connection...</div>
      <button class="retry-btn" onclick="location.reload()">Try Again</button>
    </div>
  </div>

  <script>
    (function () {
      var canvas = document.getElementById('gameCanvas');
      var ctx = canvas.getContext('2d');
      var scoreEl = document.getElementById('score');
      var bestEl = document.getElementById('best');
      var hintEl = document.getElementById('runnerHint');

      var W = canvas.width;
      var H = canvas.height;
      var GROUND_Y = H - 24;

      var BEST_KEY = 'offlineRunnerBest';
      var best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
      bestEl.textContent = best;

      var state = 'ready'; // ready | playing | gameover
      var score = 0;
      var speed = 0;
      var baseSpeed = 220; // px/sec
      var gravity = 2200; // px/sec^2
      var jumpVelocity = -720; // px/sec

      var player = { x: 40, y: GROUND_Y - 30, w: 30, h: 30, vy: 0, onGround: true };
      var obstacles = [];
      var nextSpawnIn = 0;
      var lastTime = null;

      function resetGame() {
        score = 0;
        speed = baseSpeed;
        player.y = GROUND_Y - player.h;
        player.vy = 0;
        player.onGround = true;
        obstacles = [];
        nextSpawnIn = randRange(700, 1300);
        scoreEl.textContent = '0';
      }

      function randRange(min, max) {
        return min + Math.random() * (max - min);
      }

      function jump() {
        if (state === 'ready') {
          resetGame();
          state = 'playing';
          hintEl.textContent = '';
          lastTime = null;
          requestAnimationFrame(loop);
          return;
        }
        if (state === 'gameover') {
          resetGame();
          state = 'playing';
          hintEl.textContent = '';
          lastTime = null;
          requestAnimationFrame(loop);
          return;
        }
        if (state === 'playing' && player.onGround) {
          player.vy = jumpVelocity;
          player.onGround = false;
        }
      }

      function spawnObstacle() {
        var h = randRange(20, 36);
        var w = randRange(16, 26);
        obstacles.push({ x: W + w, y: GROUND_Y - h, w: w, h: h, emoji: Math.random() < 0.5 ? '🌵' : '🪨' });
      }

      function update(dt) {
        // physics
        player.vy += gravity * dt;
        player.y += player.vy * dt;
        if (player.y >= GROUND_Y - player.h) {
          player.y = GROUND_Y - player.h;
          player.vy = 0;
          player.onGround = true;
        }

        // speed ramps up slowly with score
        speed = baseSpeed + Math.min(score, 600) * 0.35;

        // spawn
        nextSpawnIn -= dt * 1000;
        if (nextSpawnIn <= 0) {
          spawnObstacle();
          nextSpawnIn = randRange(650, 1400) - Math.min(score, 500);
          if (nextSpawnIn < 450) nextSpawnIn = 450;
        }

        // move obstacles
        for (var i = obstacles.length - 1; i >= 0; i--) {
          obstacles[i].x -= speed * dt;
          if (obstacles[i].x + obstacles[i].w < 0) {
            obstacles.splice(i, 1);
          }
        }

        // score by distance survived
        score += dt * 60;
        scoreEl.textContent = Math.floor(score);

        // collisions
        var px = player.x + 4, py = player.y + 4, pw = player.w - 8, ph = player.h - 8;
        for (var j = 0; j < obstacles.length; j++) {
          var o = obstacles[j];
          var ox = o.x + 3, oy = o.y + 3, ow = o.w - 6, oh = o.h - 6;
          if (px < ox + ow && px + pw > ox && py < oy + oh && py + ph > oy) {
            gameOver();
            break;
          }
        }
      }

      function gameOver() {
        state = 'gameover';
        var finalScore = Math.floor(score);
        if (finalScore > best) {
          best = finalScore;
          localStorage.setItem(BEST_KEY, String(best));
          bestEl.textContent = best;
        }
        hintEl.textContent = 'Game over — press Space / tap to try again';
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);

        // ground line
        ctx.strokeStyle = 'rgba(248, 250, 252, 0.25)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        ctx.lineTo(W, GROUND_Y);
        ctx.stroke();

        // player
        ctx.font = '28px sans-serif';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText('🦖', player.x, player.y + player.h);

        // obstacles
        for (var i = 0; i < obstacles.length; i++) {
          var o = obstacles[i];
          ctx.font = (o.h + 4) + 'px sans-serif';
          ctx.fillText(o.emoji, o.x, o.y + o.h);
        }

        if (state === 'ready') {
          ctx.font = '28px sans-serif';
          ctx.fillText('🦖', player.x, GROUND_Y);
        }
      }

      function loop(ts) {
        if (state !== 'playing') {
          draw();
          return;
        }
        if (lastTime === null) lastTime = ts;
        var dt = Math.min((ts - lastTime) / 1000, 0.05);
        lastTime = ts;

        update(dt);
        draw();

        requestAnimationFrame(loop);
      }

      draw();

      window.addEventListener('keydown', function (e) {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
          e.preventDefault();
          jump();
        }
      });
      canvas.addEventListener('mousedown', jump);
      canvas.addEventListener('touchstart', function (e) { e.preventDefault(); jump(); }, { passive: false });
    })();

    window.addEventListener('online', function() {
      document.getElementById('retrySection').innerHTML = '<div class="online-notice">' +
        '<div style="font-size: 48px; margin-bottom: 12px;">✅</div>' +
        '<h3>You\'re Back Online!</h3>' +
        '<p style="color: rgba(248, 250, 252, 0.8); margin: 12px 0;">Connection restored. Let\'s get you back on track.</p>' +
        '<button onclick="location.reload()" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); margin-top: 12px;">Reload Page</button>' +
        '</div>';
      setTimeout(function() { location.reload(); }, 2000);
    });
  </script>
</body>
</html>
